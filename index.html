      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --pink: #ec4899;
      --amber: #f59e0b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 20px 36px;
      gap: 14px;
    }
    .top-banner {
      width: 100%;
      max-width: 1180px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-badge {
      background: linear-gradient(135deg, #111827, #334155);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 999px;
      letter-spacing: 0.03em;
    }
    .brand h1 {
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
    }
    .matchup-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .pill {
      padding: 6px 11px;
      border-radius: 999px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      font-size: 12px;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .pill:hover, .pill.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }

    .toolbar {
      width: 100%;
      max-width: 1180px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
    }
    .toolbar-group {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .field label {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .field input, .field select {
      padding: 8px 11px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      background: #f8fafc;
      min-width: 150px;
    }
    .btn {
      padding: 8px 14px;
      border-radius: 9px;
      border: 1px solid #cbd5e1;
      background: #fff;
      font-size: 13px;
      font-weight: 700;
      color: #1e293b;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
    }
    .btn:hover {
      background: #f1f5f9;
      transform: translateY(-1px);
    }
    .btn.active-toggle {
      background: #fef3c7;
      border-color: #f59e0b;
      color: #92400e;
    }
    .btn-random {
      background: #eff6ff;
      border-color: #93c5fd;
      color: #1d4ed8;
    }
    .btn-record {
      background: #dc2626;
      color: #ffffff;
      border-color: #dc2626;
    }

    }

      max-width: 1120px;
      height: 520px;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.07);
      position: relative;
      user-select: none;
    }
    .frame-header {
      height: 54px;
      flex-shrink: 0;
      border-bottom: 1px solid #e5e7eb;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      background: #ffffff;
      z-index: 4;

    .frame-header-title {
      text-align: center;
      font-size: 21px;
      font-weight: 500;
      color: #1f2937;

      justify-content: center;

      min-height: 0;
      display: grid;

      background: #ffffff;
    }
    .pane {

      width: 100%;

    }

    }
    canvas {

      width: 100% !important;
      height: 100% !important;
      display: block;
      background: #ffffff;
    }

      border-radius: 999px;

      font-weight: 700;

      color: #9ca3af;

    function createGiraffeTexture(isHighDetail) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      if (!isHighDetail) {
        ctx.fillStyle = '#f3d299';
        ctx.fillRect(0, 0, 512, 512);
        const colors = ['#9a4b1a', '#b86528', '#7c3710', '#d18845'];
        for (let y = 0; y < 512; y += 44) {
          for (let x = 0; x < 512; x += 44) {
            ctx.fillStyle = colors[(x + y) % colors.length];
            ctx.beginPath();
            ctx.moveTo(x + 4, y + 4);
            ctx.lineTo(x + 38, y + 8);
            ctx.lineTo(x + 32, y + 38);
            ctx.lineTo(x + 8, y + 34);
            ctx.closePath();
            ctx.fill();
          }
        }
      } else {
        ctx.fillStyle = '#f5cfa0';
        ctx.fillRect(0, 0, 512, 512);
        for (let i = 0; i < 65; i++) {
          const x = (Math.sin(i * 78.233) * 0.5 + 0.5) * 512;
          const y = (Math.cos(i * 45.164) * 0.5 + 0.5) * 512;
          const r = 22 + (i % 14);
          ctx.fillStyle = i % 3 === 0 ? '#7a2e0e' : (i % 2 === 0 ? '#9c4116' : '#b3521e');
          ctx.beginPath();
          const sides = 7;
          for (let s = 0; s < sides; s++) {
            const ang = (s / sides) * Math.PI * 2;
            const rad = r * (0.78 + 0.25 * Math.sin(s * 2.3 + x));
            const px = x + Math.cos(ang) * rad;
            const py = y + Math.sin(ang) * rad;
            if (s === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();
        }
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    function addEyesToHead(headParent, isRight, xPos, yPos, zSpread, scale = 1.0) {
      const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const pupilMat = new THREE.MeshBasicMaterial({ color: 0x111827 });
      const pupils = [];

      [-1, 1].forEach((side, idx) => {
        const eyeRadius = ((!isRight && showGooglyEyes) ? 0.13 : 0.065) * scale;
        const eyeBall = new THREE.Mesh(new THREE.SphereGeometry(eyeRadius, 12, 12), whiteMat);
        eyeBall.position.set(xPos, yPos, side * zSpread);
        headParent.add(eyeBall);

        const pupilRadius = eyeRadius * 0.55;
        const pupil = new THREE.Mesh(new THREE.SphereGeometry(pupilRadius, 10, 10), pupilMat);
        pupil.position.set(eyeRadius * 0.7, (!isRight && showGooglyEyes) ? (idx === 0 ? 0.04 : -0.04) : 0, 0);
        eyeBall.add(pupil);
        pupils.push(pupil);
      });
      return pupils;
    }

    function addDustTrail(stage, count = 14, colorHex = 0xe7d6be) {
      const dustParticles = [];
      const dustMat = new THREE.MeshStandardMaterial({
        color: colorHex,
        roughness: 0.9,
        transparent: true,
        opacity: 0.75
      });
      for (let i = 0; i < count; i++) {
        const p = new THREE.Mesh(new THREE.SphereGeometry(0.06 + (i % 3) * 0.035, 8, 8), dustMat);
        p.position.set(-1.0 - Math.random() * 1.8, -1.9 + Math.random() * 0.25, (Math.random() - 0.5) * 1.1);
        stage.rootGroup.add(p);
        dustParticles.push({ mesh: p, offset: i * 0.41 });
      }
      return dustParticles;
    }

    function createStage(container, isRightModel) {
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xffffff);

      const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100);
      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setClearColor(0xffffff, 1);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      const hemi = new THREE.HemisphereLight(0xffffff, 0xf3e8d2, 0.9);
      scene.add(hemi);

      const dirLight = new THREE.DirectionalLight(0xfffbeb, 0.92);
      dirLight.position.set(4, 9, 5);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 1024;
      dirLight.shadow.mapSize.height = 1024;
      dirLight.shadow.camera.near = 1;
      dirLight.shadow.camera.far = 25;
      const d = 5.5;
      dirLight.shadow.camera.left = -d;
      dirLight.shadow.camera.right = d;
      dirLight.shadow.camera.top = d;
      dirLight.shadow.camera.bottom = -d;
      scene.add(dirLight);

      const floorGeo = new THREE.PlaneGeometry(30, 30);
      const floorMat = new THREE.ShadowMaterial({ opacity: 0.15 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -2.0;
      floor.receiveShadow = true;
      scene.add(floor);

      const rootGroup = new THREE.Group();
      scene.add(rootGroup);

      return { scene, camera, renderer, rootGroup, container, isRightModel, actors: {} };
    }

      const builders = {

        trex: buildTrexScene,
        cat: buildCatScene,
        duck: buildDuckScene,
        crab: buildCrabScene,
        penguin: buildPenguinScene,
        dragon: buildDragonScene,
        octo: buildOctoScene
      };
      const fn = builders[preset] || buildGiraffeScene;
      fn(leftStage);
      fn(rightStage);

      const meta = SCENE_ROASTS[preset] || SCENE_ROASTS.giraffe;
      camDist = meta.dist || 10.8;
      camLookX = meta.lookX !== undefined ? meta.lookX : 0.0;
      camLookY = meta.lookY !== undefined ? meta.lookY : 0.1;

      updateLabelsAndTweet();
    }

    sceneSelect.addEventListener('change', () => loadPreset(sceneSelect.value));

    document.getElementById('resetCamBtn').addEventListener('click', () => {
      camYaw = 0.22;
      camPitch = 0.14;
      const meta = SCENE_ROASTS[sceneSelect.value] || SCENE_ROASTS.giraffe;
      camDist = meta.dist || 10.8;
      camLookX = meta.lookX !== undefined ? meta.lookX : 0.0;
      camLookY = meta.lookY !== undefined ? meta.lookY : 0.1;
    });

    document.getElementById('randomBtn').addEventListener('click', () => {
      const scenes = ['giraffe', 'trex', 'cat', 'duck', 'crab', 'penguin', 'dragon', 'octo'];
      const nextScene = scenes[Math.floor(Math.random() * scenes.length)];
      sceneSelect.value = nextScene;

      const pills = Array.from(document.querySelectorAll('#matchupPills .pill'));
      const randPill = pills[Math.floor(Math.random() * pills.length)];
      pills.forEach((b) => b.classList.remove('active'));
      randPill.classList.add('active');
      leftLabelInput.value = randPill.getAttribute('data-left');
      rightLabelInput.value = randPill.getAttribute('data-right');

      loadPreset(nextScene);
    });

    const captureFrameEl = document.getElementById('captureFrame');
    captureFrameEl.addEventListener('mousedown', (e) => {
      isDragging = true;
      prevX = e.clientX;
      prevY = e.clientY;
    });
    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      camYaw -= (e.clientX - prevX) * 0.007;
      camPitch = Math.max(-0.2, Math.min(0.85, camPitch + (e.clientY - prevY) * 0.006));
      prevX = e.clientX;
      prevY = e.clientY;
    });
    window.addEventListener('mouseup', () => { isDragging = false; });

    captureFrameEl.addEventListener('wheel', (e) => {
      e.preventDefault();
      camDist = Math.max(4.5, Math.min(18.0, camDist + e.deltaY * 0.006));
    }, { passive: false });

    function resizeStages() {
      [leftStage, rightStage].forEach((st) => {
        const w = st.container.clientWidth || 520;
        const h = st.container.clientHeight || 456;
        if (st.lastW !== w || st.lastH !== h) {
          st.lastW = w;
          st.lastH = h;
          st.camera.aspect = w / h;
          st.camera.updateProjectionMatrix();
          st.renderer.setSize(w, h, false);
        }
      });
    }
    window.addEventListener('resize', resizeStages);

    loadPreset('giraffe');
    resizeStages();

    function updateStageAnimation(st, t) {
      const a = st.actors;
      if (!a) return;
      const chaos = parseFloat(chaosSelect.value || '1.65');
      const isRight = st.isRightModel;
      // Left model gets extra funny wobble/derp multiplier!
      const derpFactor = isRight ? 1.0 : chaos;

      // Animate googly pupils on left model
      if (!isRight && showGooglyEyes && Array.isArray(a.pupils)) {
        a.pupils.forEach((p, idx) => {
          const dir = idx === 0 ? 1 : -1;
          p.position.y = Math.sin(t * 9 * derpFactor + idx) * 0.045;
          p.position.z = Math.cos(t * 9 * derpFactor * dir) * 0.045;
        });
      }

      // Dust particles
      if (Array.isArray(a.dustParticles)) {
        a.dustParticles.forEach((dp) => {
          const prog = (t * 1.9 * (isRight ? 1.1 : chaos * 0.8) + dp.offset) % 1;
          dp.mesh.position.x = -0.5 - prog * 2.3;
          dp.mesh.position.y = -1.9 + Math.sin(prog * Math.PI) * 0.35;
          const sc = (1 - prog) * 1.25;
          dp.mesh.scale.set(sc, sc, sc);
        });
      }

      if (a.type === 'giraffe') {
        const cycle = t * 6.2 * (isRight ? 1.05 : chaos * 0.85);
        a.bodyGroup.position.y = Math.sin(cycle * 2) * (isRight ? 0.14 : 0.24 * derpFactor) + 0.15;
        a.bodyGroup.rotation.z = Math.cos(cycle) * (isRight ? 0.1 : 0.22 * derpFactor);
        a.bodyGroup.rotation.x = isRight ? 0 : Math.sin(cycle * 1.5) * 0.14 * derpFactor;
        a.neckPivot.rotation.z = Math.sin(cycle - 0.6) * (isRight ? 0.09 : 0.32 * derpFactor);
        a.tailPivot.rotation.z = Math.sin(cycle * 1.5) * 0.35;

        a.legs.forEach((leg, i) => {
          const swing = Math.sin(cycle + leg.phase);
          leg.hip.rotation.z = swing * (isRight ? 0.62 : 0.85 * derpFactor);
          leg.hip.rotation.x = isRight ? 0 : Math.cos(cycle + i) * 0.25 * derpFactor;
          leg.knee.rotation.z = Math.max(0, -Math.cos(cycle + leg.phase)) * (leg.isFront ? -0.78 : 0.68);
        });
      } else if (a.type === 'trex') {
        const cycle = t * 7.5 * (isRight ? 1.0 : chaos * 0.85);
        a.bodyGroup.position.y = Math.abs(Math.sin(cycle)) * 0.25;
        a.bodyGroup.rotation.z = (isRight ? 0.08 : 0.25) * Math.sin(cycle);
        a.jawPivot.rotation.z = -0.18 - Math.abs(Math.sin(t * 8)) * 0.28;
        a.tailGroup.rotation.y = Math.sin(cycle) * 0.28;
        a.arms.forEach((arm) => {
          arm.armPivot.rotation.z = Math.sin(t * 18 * derpFactor + arm.phase) * (isRight ? 0.35 : 0.95);
        });
        a.legs.forEach((leg) => {
          leg.hip.rotation.z = Math.sin(cycle + leg.phase) * 0.65;
          leg.ankle.rotation.z = Math.cos(cycle + leg.phase) * 0.45;
        });
      } else if (a.type === 'cat') {
        const cycle = t * 9.5 * (isRight ? 1.0 : chaos * 0.9);
        a.bodyGroup.position.y = Math.sin(cycle * 2) * 0.22 + 0.05;
        a.bodyGroup.rotation.z = Math.cos(cycle) * (isRight ? 0.14 : 0.32);
        if (!isRight) a.bodyGroup.position.z = Math.sin(t * 14) * 0.22;
        a.tailPivot.rotation.z = Math.sin(t * 10) * 0.45;
        a.legs.forEach((leg) => {
          leg.legPivot.rotation.z = Math.sin(cycle + leg.phase) * 0.78;
        });
      } else if (a.type === 'duck') {
        const cycle = t * 9.0 * (isRight ? 1.0 : chaos * 0.85);
        a.bodyGroup.position.y = Math.abs(Math.sin(cycle)) * 0.18;
        a.bodyGroup.rotation.x = Math.sin(cycle) * (isRight ? 0.16 : 0.38);
        a.headGroup.rotation.y = isRight ? Math.sin(cycle) * 0.15 : t * 6.5 * derpFactor;
        a.wings.forEach((w) => {
          w.wingPivot.rotation.x = w.side * Math.abs(Math.sin(cycle * 1.5)) * (isRight ? 0.45 : 0.95);
        });
        a.feet.forEach((f) => {
          f.legPivot.rotation.z = Math.sin(cycle + f.phase) * 0.68;
        });
      } else if (a.type === 'crab') {
        const cycle = t * 8.5 * (isRight ? 1.0 : chaos * 0.85);
        a.bodyGroup.position.y = Math.abs(Math.sin(cycle)) * 0.24 - 0.35;
        a.bodyGroup.position.z = Math.sin(cycle * 0.5) * 0.45;
        a.bodyGroup.rotation.z = isRight ? Math.sin(cycle) * 0.12 : Math.sin(cycle) * 0.45;
        a.claws.forEach((c) => {
          c.clawPivot.position.y = 0.15 + Math.abs(Math.sin(cycle + c.phase)) * 0.28;
          c.clawPivot.rotation.z = Math.sin(cycle + c.phase) * 0.45;
        });
        a.legs.forEach((l) => {
          l.legPivot.rotation.z = Math.sin(cycle + l.phase) * 0.45;
        });
      } else if (a.type === 'penguin') {
        const cycle = t * 6.5 * (isRight ? 1.0 : chaos * 0.85);
        if (isRight) {
          a.bodyGroup.position.y = -0.85 + Math.sin(cycle * 2) * 0.06;
          a.bodyGroup.rotation.z = Math.sin(cycle) * 0.05;
        } else {
          // Derpy bowling-pin tumble on left!
          a.bodyGroup.position.y = -0.35 + Math.abs(Math.sin(cycle)) * 0.45;
          a.bodyGroup.rotation.z = t * 3.8 * derpFactor;
        }
        a.flippers.forEach((f) => {
          f.flipPivot.rotation.x = f.side * Math.sin(cycle * 2) * 0.45;
        });
      } else if (a.type === 'dragon') {
        a.segments.forEach((seg, idx) => {
          seg.position.y = Math.sin(t * 5.5 * (isRight ? 1 : 1.3) - idx * 0.45) * (isRight ? 0.35 : 0.52);
          if (!isRight) seg.rotation.x = t * 3 + idx;
        });
        a.leftWing.rotation.x = Math.sin(t * 7.5) * 0.65;
        a.rightWing.rotation.x = -Math.sin(t * 7.5) * 0.65;
      } else if (a.type === 'octo') {
        a.head.position.y = 0.35 + Math.sin(t * 5) * 0.16;
        a.arms.forEach((arm) => {
          arm.joints.forEach((j, idx) => {
            j.rotation.z = -0.5 + Math.sin(t * 5.5 * (isRight ? 1 : derpFactor) + arm.phase - idx * 0.5) * (isRight ? 0.35 : 0.72);
          });
        });
      }
    }

    const clock = new THREE.Clock();
    const timerBadge = document.getElementById('timerBadge');
    function animate() {
      requestAnimationFrame(animate);
      resizeStages();
      const t = clock.getElapsedTime();
      const secs = Math.floor(t % 15);
      timerBadge.textContent = `0:${secs < 10 ? '0' + secs : secs}`;

      const cx = camLookX + Math.sin(camYaw) * Math.cos(camPitch) * camDist;
      const cy = camLookY + Math.sin(camPitch) * camDist;
      const cz = Math.cos(camYaw) * Math.cos(camPitch) * camDist;

      [leftStage, rightStage].forEach((st) => {
        st.camera.position.set(cx, cy, cz);
        st.camera.lookAt(camLookX, camLookY, 0);
        updateStageAnimation(st, t);
        st.renderer.render(st.scene, st.camera);
      });
    }
    animate();

    // 1-Click Composite Video Recorder (.webm)
    const recordBtn = document.getElementById('recordBtn');
    recordBtn.addEventListener('click', () => {
      const compCanvas = document.createElement('canvas');
      compCanvas.width = 1280;
      compCanvas.height = 800;
      const ctx = compCanvas.getContext('2d');

      const stream = compCanvas.captureStream(60);
      const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
      const chunks = [];
      recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${leftLabelInput.value.replace(/\s+/g, '_')}_vs_${rightLabelInput.value.replace(/\s+/g, '_')}_${sceneSelect.value}.webm`;
        a.click();
        recordBtn.textContent = '⏺ Record 8s Video';
        recordBtn.disabled = false;
      };

      recordBtn.disabled = true;
      recordBtn.textContent = '🔴 Recording 8s...';
      recorder.start();

      const startTime = performance.now();
      function drawComposite() {
        if (performance.now() - startTime > 8000) {
          recorder.stop();
          return;
        }
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 1280, 800);

        ctx.drawImage(leftStage.renderer.domElement, 0, 64, 640, 736);
        ctx.drawImage(rightStage.renderer.domElement, 640, 64, 640, 736);

        ctx.strokeStyle = '#e5e7eb';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, 64);
        ctx.lineTo(1280, 64);
        ctx.moveTo(640, 0);
        ctx.lineTo(640, 800);
        ctx.stroke();

        ctx.fillStyle = '#1f2937';
        ctx.font = '500 26px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(leftLabelInput.value, 320, 42);
        ctx.fillText(rightLabelInput.value, 960, 42);

        if (showRoasts) {
          ctx.font = '700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
          ctx.fillStyle = '#b91c1c';
          ctx.fillText(leftRoastBadge.textContent, 320, 98);
          ctx.fillStyle = '#047857';
          ctx.fillText(rightRoastBadge.textContent, 960, 98);
        }

        ctx.fillStyle = '#9ca3af';
        ctx.font = '500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(watermarkInput.value, 1254, 776);

        requestAnimationFrame(drawComposite);
      }
      drawComposite();
    });
  </script>
</body>
</html>
